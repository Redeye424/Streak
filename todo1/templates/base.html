<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    {% load static %}
    <link rel="manifest" href="{% static 'todo1/manifest.json' %}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Streak">
    <link rel="apple-touch-icon" href="{% static 'icons/icon-192.png' %}">
    <link rel="stylesheet" href="{% static 'todo1/style.css' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Streak{% endblock %}</title>
</head>
<body>
    <div class="bg-pattern">
    <!-- Pentagons -->
    <span class="pentagon" style="--x:5%; --y:8%; --s:40px; --r:12deg;"></span>
    <span class="pentagon" style="--x:18%; --y:30%; --s:70px; --r:-8deg;"></span>
    <span class="pentagon" style="--x:35%; --y:15%; --s:55px; --r:25deg;"></span>
    <span class="pentagon" style="--x:52%; --y:45%; --s:90px; --r:-18deg;"></span>
    <span class="pentagon" style="--x:72%; --y:20%; --s:45px; --r:8deg;"></span>
    <span class="pentagon" style="--x:82%; --y:65%; --s:75px; --r:-12deg;"></span>
    <span class="pentagon" style="--x:10%; --y:22%; --s:35px; --r:-10deg;"></span>
    <span class="pentagon" style="--x:14%; --y:68%; --s:60px; --r:18deg;"></span>
    <span class="pentagon" style="--x:22%; --y:12%; --s:45px; --r:-22deg;"></span>
    <span class="pentagon" style="--x:28%; --y:48%; --s:80px; --r:9deg;"></span>
    <span class="pentagon" style="--x:33%; --y:75%; --s:50px; --r:-14deg;"></span>
    <span class="pentagon" style="--x:40%; --y:28%; --s:65px; --r:16deg;"></span>
    <span class="pentagon" style="--x:47%; --y:62%; --s:38px; --r:-6deg;"></span>
    <span class="pentagon" style="--x:56%; --y:14%; --s:52px; --r:21deg;"></span>
    <span class="pentagon" style="--x:63%; --y:52%; --s:72px; --r:-17deg;"></span>
    <span class="pentagon" style="--x:68%; --y:82%; --s:52px; --r:11deg;"></span>
    <span class="pentagon" style="--x:75%; --y:8%; --s:58px; --r:-25deg;"></span>
    <span class="pentagon" style="--x:80%; --y:42%; --s:48px; --r:7deg;"></span>
    <span class="pentagon" style="--x:87%; --y:78%; --s:66px; --r:-9deg;"></span>
    <span class="pentagon" style="--x:92%; --y:55%; --s:36px; --r:13deg;"></span>
    <span class="pentagon" style="--x:6%; --y:50%; --s:54px; --r:-19deg;"></span>
    <span class="pentagon" style="--x:30%; --y:90%; --s:46px; --r:5deg;"></span>
    <span class="pentagon" style="--x:58%; --y:35%; --s:84px; --r:-12deg;"></span>
    <span class="pentagon" style="--x:95%; --y:25%; --s:40px; --r:20deg;"></span>
    <!-- Stars -->
    <span class="star" style="--x:12%; --y:15%; --size:2px;"></span>
    <span class="star" style="--x:25%; --y:55%; --size:3px;"></span>
    <span class="star" style="--x:45%; --y:10%; --size:2px;"></span>
    <span class="star" style="--x:60%; --y:72%; --size:4px;"></span>
    <span class="star" style="--x:78%; --y:38%; --size:2px;"></span>
    <span class="star" style="--x:90%; --y:18%; --size:3px;"></span>
    <span class="star" style="--x:8%; --y:82%; --size:2px;"></span>
    <span class="star" style="--x:55%; --y:88%; --size:3px;"></span>
    </div>
    <main>



<!-- Three-line button -->
<button id="openBtn" type="button">
    <span class="line"></span>
    <span class="line"></span>
    <span class="line"></span>
</button>

<!-- Pop-up Box -->
<dialog id="myPopup">
    {% if user.is_authenticated %}
    <form method="POST" action="{% url 'logout' %}">
        {% csrf_token %}

        <input type="hidden" name="action" value="logout">

        <button class="button" type="submit">
            logout
        </button>
    </form>
    <form method="POST" action="{% url 'create_streak' %}">
        {% csrf_token %}
        <button class="button" type="submit">
            New Streak
        </button>
    </form>
    {% else %}
    <form method="POST" action="{% url 'signup' %}">
        {% csrf_token %}
        <button class="button" type="submit">
            Join Now
        </button>
    </form>
    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <button class="button" type="submit">
            Hop Back In
        </button>
    </form>
    {% endif %}
</dialog>



<script>
    const openBtn = document.getElementById("openBtn");
    const myPopup = document.getElementById("myPopup");

    openBtn.addEventListener("click", function () {

        if (myPopup.open) {

            // Close popup
            myPopup.close();

            // Turn X back into hamburger
            openBtn.classList.remove("open");

        } else {

            // Open popup
            myPopup.show();

            // Turn hamburger into X
            openBtn.classList.add("open");

        }

    });


    // If popup is closed another way
    myPopup.addEventListener("close", function () {

        openBtn.classList.remove("open");

    });
</script>





    </main>
{% block content %}{% endblock %}
</body>
</html>
